
spring.application.name=demo

# Local dev: use H2 in-memory database by default to run without Postgres
# MODE=PostgreSQL improves SQL compatibility for simple migrations/queries
spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Flyway disabled for H2 local runs; migrations are not applied in this profile

# Let Hibernate create the schema in H2 for local dev
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Ensure Hibernate loads data.sql after schema generation
spring.jpa.properties.hibernate.hbm2ddl.import_files=data.sql

# Defer Spring's datasource initialization until after Hibernate schema generation
spring.jpa.defer-datasource-initialization=true
